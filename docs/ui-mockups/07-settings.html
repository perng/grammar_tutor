<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings Panel — Handy Grammar</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f4f6ff;
    --surface: #ffffff;
    --surface2: #f0f2ff;
    --primary: #4f46e5;
    --primary-light: #818cf8;
    --primary-dark: #3730a3;
    --text: #1e1b4b;
    --text-muted: #6b7280;
    --border: #e0e7ff;
    --green: #10b981;
    --radius: 18px;
    --shadow: 0 2px 12px rgba(79,70,229,0.08);
    --shadow-lg: 0 8px 32px rgba(79,70,229,0.14);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    max-width: 430px;
    margin: 0 auto;
    position: relative;
  }

  /* Dimmed backdrop showing the screen underneath */
  .backdrop-screen {
    padding: 52px 16px 20px;
    opacity: 0.35;
    pointer-events: none;
    user-select: none;
  }
  .backdrop-topbar {
    background: var(--surface);
    border-radius: 14px;
    padding: 12px 16px;
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px; border: 1px solid var(--border);
  }
  .backdrop-logo { display: flex; align-items: center; gap: 8px; }
  .backdrop-logo-icon { width: 28px; height: 28px; background: linear-gradient(135deg,#4f46e5,#7c3aed); border-radius: 8px; }
  .backdrop-logo-name { font-size: 0.9rem; font-weight: 800; color: var(--primary-dark); }
  .backdrop-actions { display: flex; gap: 6px; }
  .backdrop-icon { width: 28px; height: 28px; background: var(--surface2); border-radius: 8px; border: 1px solid var(--border); }
  .backdrop-card {
    background: var(--surface); border-radius: 18px; padding: 16px;
    border: 1px solid var(--border); margin-bottom: 10px; height: 80px;
  }

  /* Scrim overlay */
  .scrim {
    position: fixed; inset: 0;
    background: rgba(15, 10, 40, 0.5);
    backdrop-filter: blur(3px);
    max-width: 430px; margin: 0 auto;
  }

  /* Bottom sheet */
  .sheet {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 430px;
    background: var(--surface);
    border-radius: 28px 28px 0 0;
    box-shadow: 0 -8px 40px rgba(15,10,40,0.2);
    padding: 0 0 40px;
    animation: slideUpSheet 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    z-index: 100;
  }
  @keyframes slideUpSheet {
    from { transform: translateX(-50%) translateY(100%); }
    to { transform: translateX(-50%) translateY(0); }
  }

  /* Sheet handle */
  .sheet-handle {
    width: 40px; height: 4px;
    background: #d1d5db; border-radius: 99px;
    margin: 12px auto 0;
  }

  /* Sheet header */
  .sheet-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 20px 6px;
  }
  .sheet-title { font-size: 1.1rem; font-weight: 900; color: var(--text); letter-spacing: -0.02em; }
  .sheet-close {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--surface2); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; cursor: pointer; color: var(--text-muted);
  }

  /* Section label */
  .sheet-section-label {
    font-size: 0.68rem; font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--text-muted);
    padding: 18px 20px 8px;
  }

  /* Language options */
  .lang-grid {
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    gap: 8px; padding: 0 16px;
  }
  .lang-btn {
    border: 2px solid var(--border);
    border-radius: 16px; padding: 14px 8px;
    text-align: center; cursor: pointer;
    transition: all 0.15s; background: var(--surface2);
    position: relative;
  }
  .lang-btn:hover { border-color: var(--primary-light); }
  .lang-btn.active {
    border-color: var(--primary);
    background: linear-gradient(135deg, #eef2ff, #e0e7ff);
    box-shadow: 0 4px 16px rgba(79,70,229,0.18);
  }
  .lang-flag { font-size: 28px; display: block; margin-bottom: 6px; }
  .lang-name { font-size: 0.78rem; font-weight: 800; color: var(--text); display: block; }
  .lang-native { font-size: 0.68rem; color: var(--text-muted); display: block; margin-top: 1px; }
  .lang-check {
    position: absolute; top: 8px; right: 8px;
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--primary); color: white;
    font-size: 9px; display: none;
    align-items: center; justify-content: center;
    font-weight: 900;
  }
  .lang-btn.active .lang-check { display: flex; }

  /* Divider */
  .sheet-divider { height: 1px; background: var(--border); margin: 4px 16px; }

  /* Theme options */
  .theme-row {
    display: flex; gap: 8px; padding: 0 16px;
  }
  .theme-btn {
    flex: 1; border: 2px solid var(--border); border-radius: 16px;
    padding: 14px 8px; text-align: center; cursor: pointer;
    transition: all 0.15s; background: var(--surface2);
    position: relative;
  }
  .theme-btn:hover { border-color: var(--primary-light); }
  .theme-btn.active {
    border-color: var(--primary);
    background: linear-gradient(135deg, #eef2ff, #e0e7ff);
    box-shadow: 0 4px 16px rgba(79,70,229,0.18);
  }
  .theme-icon-wrap {
    width: 40px; height: 40px; border-radius: 12px;
    margin: 0 auto 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .theme-icon-light { background: linear-gradient(135deg, #fef9c3, #fde68a); }
  .theme-icon-dark { background: linear-gradient(135deg, #1e1b4b, #312e81); }
  .theme-icon-system { background: linear-gradient(135deg, #f0f2ff, #e0e7ff); }
  .theme-name { font-size: 0.8rem; font-weight: 800; color: var(--text); display: block; }
  .theme-check {
    position: absolute; top: 8px; right: 8px;
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--primary); color: white;
    font-size: 9px; display: none;
    align-items: center; justify-content: center; font-weight: 900;
  }
  .theme-btn.active .theme-check { display: flex; }

  /* About / Version row */
  .sheet-about {
    margin: 16px 16px 0;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 16px; padding: 14px 16px;
    display: flex; align-items: center; gap: 12px; cursor: pointer;
  }
  .about-icon {
    width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; color: white; flex-shrink: 0;
  }
  .about-body { flex: 1; }
  .about-title { font-size: 0.85rem; font-weight: 700; color: var(--text); }
  .about-sub { font-size: 0.72rem; color: var(--text-muted); margin-top: 1px; }
  .about-arrow { color: var(--text-muted); }

  /* Reset progress row */
  .sheet-reset {
    margin: 8px 16px 0;
    background: #fef2f2; border: 1px solid #fca5a5;
    border-radius: 16px; padding: 14px 16px;
    display: flex; align-items: center; gap: 12px; cursor: pointer;
  }
  .reset-icon {
    width: 36px; height: 36px; border-radius: 10px;
    background: #fee2e2;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }
  .reset-title { font-size: 0.85rem; font-weight: 700; color: #991b1b; }
  .reset-sub { font-size: 0.72rem; color: #b91c1c; margin-top: 1px; }
</style>
</head>
<body>

<!-- Dimmed screen behind the sheet -->
<div class="backdrop-screen">
  <div class="backdrop-topbar">
    <div class="backdrop-logo">
      <div class="backdrop-logo-icon"></div>
      <div class="backdrop-logo-name">Handy Grammar</div>
    </div>
    <div class="backdrop-actions">
      <div class="backdrop-icon"></div>
      <div class="backdrop-icon"></div>
    </div>
  </div>
  <div class="backdrop-card"></div>
  <div class="backdrop-card"></div>
  <div class="backdrop-card"></div>
</div>

<!-- Scrim -->
<div class="scrim"></div>

<!-- Bottom sheet -->
<div class="sheet">
  <div class="sheet-handle"></div>

  <div class="sheet-header">
    <div class="sheet-title">Settings</div>
    <div class="sheet-close">✕</div>
  </div>

  <!-- Language section -->
  <div class="sheet-section-label">🌐 Display Language</div>
  <div class="lang-grid">
    <div class="lang-btn active">
      <div class="lang-check">✓</div>
      <span class="lang-flag">🇺🇸</span>
      <span class="lang-name">English</span>
      <span class="lang-native">English</span>
    </div>
    <div class="lang-btn">
      <div class="lang-check">✓</div>
      <span class="lang-flag">🇹🇼</span>
      <span class="lang-name">繁體中文</span>
      <span class="lang-native">Traditional</span>
    </div>
    <div class="lang-btn">
      <div class="lang-check">✓</div>
      <span class="lang-flag">🇨🇳</span>
      <span class="lang-name">简体中文</span>
      <span class="lang-native">Simplified</span>
    </div>
  </div>

  <!-- Theme section -->
  <div class="sheet-section-label">🎨 Appearance</div>
  <div class="theme-row">
    <div class="theme-btn">
      <div class="theme-check">✓</div>
      <div class="theme-icon-wrap theme-icon-light">☀️</div>
      <span class="theme-name">Light</span>
    </div>
    <div class="theme-btn">
      <div class="theme-check">✓</div>
      <div class="theme-icon-wrap theme-icon-dark">🌙</div>
      <span class="theme-name">Dark</span>
    </div>
    <div class="theme-btn active">
      <div class="theme-check">✓</div>
      <div class="theme-icon-wrap theme-icon-system">📱</div>
      <span class="theme-name">System</span>
    </div>
  </div>

  <!-- About -->
  <div class="sheet-about">
    <div class="about-icon">📖</div>
    <div class="about-body">
      <div class="about-title">About Handy Grammar</div>
      <div class="about-sub">Version 1.0 · Privacy Policy · Support</div>
    </div>
    <div class="about-arrow">›</div>
  </div>

  <!-- Reset -->
  <div class="sheet-reset">
    <div class="reset-icon">🗑️</div>
    <div class="about-body">
      <div class="reset-title">Reset All Progress</div>
      <div class="reset-sub">Clears all game progress and test history</div>
    </div>
  </div>

</div>

</body>
</html>
